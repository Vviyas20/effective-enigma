<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outreach CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a modern sales cockpit: bold, quick, a little playful
   IDEA: ink-black rails with coral signals; every card is something you can press
   PICTURE: black sidebar, white cards with ink outlines and a hard shadow, coral for action, cobalt for second signals
   COLOUR and TYPE: cool grey ground, ink #121212, coral #F0533A, cobalt #3657FF; Space Grotesk titles and figures, Inter text
   LAYOUT: sidebar, page title, card row of figures, card grid, working tables, deals board, contact drawer */
:root{color-scheme:light;--bg:#F1F1F4;--ink:#121212;--mute:#5A5A64;--line:#E3E3E8;--mist:#F3F3F6;--g:#F0533A;--gd:#B5321B;--warn:#B42318;--amber:#3657FF;--navy:#121212;--card:#FFFFFF;--in:#FFFFFF;--band:#121212;--bandInk:#F4F4F6;--soft:#FDE6E1;--r:18px;--rs:12px;--sh:0 2px 0 #121212}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
a{color:#2440E0;text-underline-offset:2px}
h1,h2,.num{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;letter-spacing:-.01em}
h1{font-size:clamp(26px,3vw,34px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:18px;margin:0 0 6px}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:#121212;color:#F4F4F6;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:20px 14px;overflow-y:auto;z-index:6}
.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 18px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--g);color:#121212;display:grid;place-items:center;font:700 14px "Space Grotesk",sans-serif;flex:none}
.brand b{display:block;font:700 15px "Space Grotesk",sans-serif}.brand small{display:block;color:#B3B3BD;font-size:12px;line-height:1.3}
nav#tabs{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:12px;color:#C4C4CC;text-decoration:none;font-weight:500;transition:background .18s,color .18s}
nav a svg{flex:none;width:18px;height:18px}
nav a:hover{background:#26262A;color:#fff}
nav a.on{background:var(--g);color:#121212;font-weight:700}
nav a span{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--g);color:#121212;border-radius:999px;padding:1px 8px}
nav a.on span{background:#121212;color:#fff}
#fresh{margin-top:auto;padding:12px 8px 0;color:#B3B3BD;font-size:12px;border-top:1px solid #2A2A2E}
.content{min-width:0}
.band{padding:clamp(14px,2vw,22px) clamp(16px,3vw,36px)}
.sub{color:var(--mute);font-size:13px}
.green{background:transparent;color:var(--ink)}
[data-go],[data-st],[data-ml]{cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
.kpi[data-go]:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--ink)}
.kpi .num{font-size:clamp(26px,2.8vw,36px);line-height:1}
.kpi.big .num{font-size:clamp(32px,4vw,48px)}
.kpi>div:last-child{font-size:13px;color:var(--mute);margin-top:8px}
.kpis>.kpi.big:first-child{background:var(--g)}.kpis>.kpi.big:first-child>div:last-child{color:#121212}
.prog{height:8px;border-radius:4px;background:var(--mist);margin-top:12px;overflow:hidden}.prog b{display:block;height:100%;background:var(--g);border-radius:4px;transition:width .5s}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.panel{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;position:relative}
.fig{position:relative;height:240px;margin-top:8px}.fig svg{position:absolute;inset:0}
.grid line,line.grid{stroke:var(--line)}.tk{fill:var(--mute);font-size:11px}.vl{fill:var(--ink);font-size:11px;font-weight:700}
.fig rect{transition:opacity .15s}.fig rect:hover{opacity:.7}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(90px,170px) 1fr 44px;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.hb[data-st]{border-radius:8px;padding:4px 6px;margin:0 -6px;transition:background .15s}.hb[data-st]:hover{background:var(--mist)}
.hb .bar{height:12px;background:var(--mist);border-radius:6px;overflow:hidden;display:flex}
.hb .bar b{display:block;height:100%;background:var(--g);border-radius:6px;transition:width .5s}.hb .bar b.m{background:var(--navy)}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.hb.wide{grid-template-columns:minmax(90px,170px) 1fr 150px}
.holq{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;font-size:clamp(26px,3.6vw,42px);line-height:1.15;max-width:26ch;margin:24px 0 12px;padding:28px 32px;background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);box-shadow:0 5px 0 var(--g)}
.usd{display:inline-flex;align-items:center;border:1.5px solid #D5D5DC;border-radius:10px;background:var(--in);padding-left:10px}.usd>span{color:var(--mute);font-size:14px}.usd input{border:0;background:transparent;width:120px;text-align:right;font-variant-numeric:tabular-nums;min-height:34px}.usd:has(input.bad){border-color:var(--warn)}.usd input.bad{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--mute);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;padding:8px;border-bottom:1.5px solid var(--ink);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.row td{transition:background .12s}tr.row:hover td{background:#F7F7FA}
.nm{font-weight:700;cursor:pointer;color:var(--ink);background:none;border:0;padding:0;min-height:0;font:inherit;font-weight:700;text-align:left;box-shadow:none}
.nm:hover{color:var(--gd);text-decoration:underline;box-shadow:none;transform:none}
.t{color:var(--mute);font-size:12px;display:block}
select,input,textarea,button{font:inherit;font-size:16px;color:var(--ink)}
select,input,textarea{background:var(--in);border:1.5px solid #D5D5DC;border-radius:10px;padding:6px 10px;min-height:38px;transition:border-color .15s}
select:hover,input:hover,textarea:hover{border-color:#9C9CA6}
td select,td input{font-size:14px;min-height:34px;max-width:170px}
button{min-height:40px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--ink);background:var(--card);cursor:pointer;font-weight:600;transition:transform .12s,box-shadow .12s,background .15s}
button:hover{box-shadow:0 2px 0 var(--ink);transform:translateY(-1px)}
button:active{transform:translateY(1px);box-shadow:none}
button.p{background:var(--g);color:#121212}
button.dn{background:var(--warn);border-color:var(--warn);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.bar-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 12px}
.bar-tools input[type=search]{flex:1 1 220px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--mist);white-space:nowrap}
.chip.hot{background:var(--g);color:#121212}.chip.bad{background:var(--soft);color:#9E2A15}.chip.mt{background:#121212;color:#fff}.chip.dnc{background:#121212;color:#fff;box-shadow:inset 0 0 0 1.5px var(--g)}.chip.st{background:var(--amber);color:#fff}
.due{font-weight:700;white-space:nowrap}.over{color:var(--gd)}.win{font-size:12px;color:var(--mute);white-space:nowrap}
.mf{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}.mf label{font-size:13px;display:flex;gap:4px;align-items:center}
.note{background:var(--card);border:1.5px dashed var(--g);border-radius:var(--rs);padding:10px 14px;font-size:13px;margin:10px 0}
.callgrp h2{margin-top:18px}
.card{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:12px 10px;border-bottom:1px solid var(--line);border-radius:12px;transition:background .12s}.card:hover{background:var(--card)}
.card .r{text-align:right}
#drawer .block{background:#121212;color:#fff;padding:14px;border-radius:12px;margin:10px 0;box-shadow:inset 0 0 0 2px var(--g)}
#drawer{position:fixed;inset:0 0 0 auto;width:min(480px,100%);background:var(--card);border-left:1.5px solid var(--ink);box-shadow:-16px 0 40px rgba(18,18,18,.18);transform:translateX(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:20;overflow-y:auto;padding:20px}
#drawer.open{transform:none}
#scrim{position:fixed;inset:0;background:rgba(18,18,18,.35);display:none;z-index:19}#scrim.open{display:block}
.fl{display:grid;gap:4px;margin:10px 0}.fl label{font-size:12px;color:var(--mute);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tl{list-style:none;padding:0;margin:0;font-size:13px}.tl li{padding:7px 0;border-bottom:1px solid var(--line)}
.empty{color:var(--mute);padding:20px 0}
.ro input,.ro select,.ro textarea,.ro button.w{pointer-events:none;opacity:.6}
.scroll{overflow-x:auto}
details summary{cursor:pointer;color:var(--mute);font-size:13px;margin-top:10px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--card)}.seg button{border:0;border-radius:0;box-shadow:none;transform:none;min-height:38px}.seg button.on{background:#121212;color:#fff}
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
.kcol{background:#E6E6EB;border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:170px;transition:background .15s,box-shadow .15s}
.kcol.over{background:var(--soft);box-shadow:inset 0 0 0 2px var(--g)}
.kcol header{display:flex;align-items:baseline;gap:6px;padding:2px 4px}.kcol header b{font:700 14px "Space Grotesk",sans-serif}.kcol header span{color:var(--mute);font-size:13px}.kcol header em{margin-left:auto;font:700 13px "Space Grotesk",sans-serif;font-style:normal}
.kcard{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:14px;background:var(--card);border:1.5px solid var(--ink);box-shadow:var(--sh);cursor:grab;transition:transform .12s,box-shadow .12s}
.kcard:hover{transform:translateY(-2px);box-shadow:0 4px 0 var(--ink)}.kcard.drag{opacity:.4}
.kcard .kv{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font:700 17px "Space Grotesk",sans-serif}.kcard .kv.no{color:var(--mute);font:600 13px Inter,sans-serif}
.kempty{border:1.5px dashed #B9B9C3;border-radius:14px;padding:16px;color:var(--mute);font-size:13px;text-align:center}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.enter>*{animation:rise .32s cubic-bezier(.2,.8,.2,1) both}.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(n+5){animation-delay:.16s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;flex-direction:row;align-items:center;padding:8px 10px;gap:8px}.brand{padding:0}.brand>div:last-child{display:none}nav#tabs{flex-direction:row;overflow-x:auto}nav a{flex:none}#fresh{display:none}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute);font-size:12px}.stack td:empty{display:none}.row2{grid-template-columns:1fr}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>

function denied(e){S.errAt=Date.now();if(e&&e.code==='invalid_argument'){S.w=false;render();flash('You have view access only, so changes are not saved.',1)}else flash('Could not save: '+(e&&e.message||'try again'),1)}
function flash(m,err){if(!err&&S.errAt&&Date.now()-S.errAt<4000)return;const n=document.createElement('div');n.className='note';n.style.cssText='position:fixed;bottom:16px;left:16px;right:16px;max-width:520px;z-index:30';n.textContent=m;document.body.appendChild(n);setTimeout(()=>n.remove(),3500)}
const BASE=['name','account','title','email','location','phone','linkedin','sheetStatus','sheetTab','prev','stage','emails','firstEmail','lastEmail','callOutcome'];
async function upd(id,patch){S.errAt=S.errAt||0;try{if(S.c.has(id))await S.db.doc('contacts/'+id).update(patch);else{const c=getC(id)||{};const o={source:'Your BI sheet'};for(const k of BASE)if(c[k]!==undefined&&c[k]!=='')o[k]=c[k];if(c.sheetNext&&!patch.nextCallManual)o.nextCallManual=c.sheetNext;await S.db.doc('contacts/'+id).set({...o,...patch})}return true}catch(e){denied(e);return false}}
async function addItem(day,it){const ref=S.db.doc('daily/'+day);try{const s=await ref.get();const a=s.exists?[...(s.data().items||[])]:[];a.push(it);await ref.set({date:day,items:a})}catch(e){denied(e)}}
const mid=(id,d)=>(id+'_'+d).replace(/[^A-Za-z0-9_\-.~:@+]/g,'-');
async function setMeeting(id,c,date){const ref=S.db.doc('meetings/'+mid(id,date));try{await ref.set({c:id,name:c.name||'',account:c.account||'',date,month:date.slice(0,7),auto:false,at:new Date().toISOString()})}catch(e){denied(e)}}
async function fixEmail(id,val){const ne=String(val||'').trim().toLowerCase();if(!/^[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$/.test(ne)){flash('That does not look like an email address.');return}
 const c=getC(id);if(!c)return;const other=getC(ne);if(other&&ne!==id){flash('That email already belongs to '+(other.name||'another contact')+'.');return}
 const db=S.c.get(id)||{},o={};for(const k of BASE)if(c[k]!==undefined&&c[k]!=='')o[k]=c[k];
