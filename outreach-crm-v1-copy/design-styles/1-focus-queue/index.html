<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Concept 1. Focus queue.
   One prospect at a time. The day's run tape is the single bold element:
   each touch is a cell that charges when sent. Everything else stays quiet. */
:root{
  --brand:#1447e6; --brand-600:#0e35b8; --brand-50:#eef2ff; --brand-100:#dbe4ff;
  --ink:#111110; --t700:#403e38; --t500:#6d6a60; --t400:#8e8a7e; --t300:#b8b4a9;
  --t200:#d8d6cf; --t100:#ecebe6; --t50:#f7f6f3;
  --canvas:#f5f7fa; --card:#fff; --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.14);
  --serif:"Instrument Serif",Georgia,serif; --sans:"Inter",system-ui,sans-serif; --mono:"DM Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font:500 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
svg{display:block}

/* top bar */
.top{display:flex;align-items:center;gap:28px;height:60px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--card)}
.logo{font:400 26px/1 var(--serif);letter-spacing:-.02em}
.logo b{color:var(--brand);font-weight:400}
.nav{display:flex;gap:4px}
.nav a{padding:6px 12px;border-radius:999px;color:var(--t500);text-decoration:none}
.nav a[aria-current]{background:var(--t100);color:var(--ink)}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;width:280px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;color:var(--t400)}
.search input{border:0;outline:0;background:none;width:100%}
.me{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}

/* run tape */
.run{display:flex;align-items:center;gap:24px;padding:20px 24px 18px}
.run h1{font:400 34px/1.1 var(--serif);letter-spacing:-.02em;white-space:nowrap}
.tape{flex:1;display:flex;gap:4px;height:28px;padding:4px;border:1.5px solid var(--ink);border-radius:8px;position:relative;min-width:200px}
.tape::after{content:"";position:absolute;right:-7px;top:8px;width:4px;height:10px;background:var(--ink);border-radius:0 2px 2px 0}
.cell{flex:1;border-radius:3px;background:var(--t100);transition:background .45s var(--ease)}
.cell.done{background:var(--brand)}
.cell.now{background:var(--brand-100);box-shadow:inset 0 0 0 1.5px var(--brand)}
.cell.snoozed{background:repeating-linear-gradient(135deg,var(--t100) 0 4px,var(--t200) 4px 8px)}
.run .count{font:500 13px var(--mono);color:var(--t500);white-space:nowrap}
.run .count strong{color:var(--ink);font-weight:500}

/* three panes */
.panes{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:16px;padding:0 24px 24px;height:calc(100vh - 60px - 76px)}
.pane{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:auto}

/* queue */
.queue{padding:8px}
.group{padding:14px 10px 6px;display:flex;justify-content:space-between;color:var(--t500);font-size:12px;font-weight:600}
.group span:last-child{font-family:var(--mono);font-weight:400}
.item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:10px;transition:background .15s}
.item:hover{background:var(--t50)}
.item[aria-selected="true"]{background:var(--brand-50)}
.item .ch{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;color:var(--t500)}
.item[aria-selected="true"] .ch{border-color:var(--brand);color:var(--brand);background:#fff}
.item .co{font-weight:600;font-size:13.5px;line-height:1.3}
.item .who{color:var(--t500);font-size:12.5px}
.warm{width:8px;height:8px;border-radius:50%;background:var(--brand)}
.item.leaving{animation:leave .35s var(--ease) forwards}
@keyframes leave{to{opacity:0;transform:translateX(24px);height:0;padding:0;margin:0}}
.empty{padding:40px 20px;text-align:center;color:var(--t500)}
.empty p:first-child{font:400 24px/1.2 var(--serif);color:var(--ink);margin-bottom:6px}

/* composer */
.work{display:flex;flex-direction:column}
.head{padding:24px 28px 18px;border-bottom:1px solid var(--line)}
.head .line1{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.head h2{font:400 40px/1.05 var(--serif);letter-spacing:-.02em}
.head .step{font:500 12px var(--mono);color:var(--t500)}
.head .who{margin-top:6px;color:var(--t700)}
.why{margin-top:16px;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--brand-50);color:var(--brand-600)}
.why svg{flex:none;margin-top:2px}
.why b{color:var(--ink);font-weight:600}
.compose{flex:1;display:flex;flex-direction:column;padding:18px 28px;gap:10px}
.field{display:flex;gap:12px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.field label{width:56px;color:var(--t400);font-size:13px}
.field input{flex:1;border:0;outline:0;background:none;font-weight:600}
textarea{flex:1;min-height:200px;resize:none;border:0;outline:0;background:none;font-size:15px;line-height:1.65;color:var(--t700);max-width:68ch}
.actions{display:flex;gap:8px;align-items:center;padding:14px 28px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;font-weight:600;font-size:13.5px;border:1px solid var(--line-2);background:#fff;transition:background .15s,border-color .15s}
.btn:hover{background:var(--t50)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-600)}
kbd{font:500 11px var(--mono);padding:1px 5px;border-radius:4px;border:1px solid currentColor;opacity:.6}
.actions .spacer{flex:1}
.hint{color:var(--t400);font-size:12.5px}

/* context */
.ctx{padding:20px}
.ctx h3{font-size:12px;font-weight:600;color:var(--t500);margin:22px 0 10px}
.ctx h3:first-child{margin-top:0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13px}
.facts dt{color:var(--t400)}
.facts dd{text-align:right}
.seq{display:flex;flex-direction:column}
.seq li{list-style:none;display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:13px;position:relative}
.seq li::before{content:"";position:absolute;left:8px;top:24px;bottom:-6px;width:1.5px;background:var(--t200)}
.seq li:last-child::before{display:none}
.dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--t300);background:#fff;position:relative;z-index:1}
.seq .sent .dot{background:var(--ink);border-color:var(--ink)}
.seq .cur .dot{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100)}
.seq .cur{font-weight:600}
.seq time{font:400 12px var(--mono);color:var(--t400)}
.note{font-size:13px;color:var(--t700);line-height:1.6}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;transition:all .25s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast button{color:var(--brand-100);font-weight:600;margin-left:12px;pointer-events:auto}

@media (max-width:1100px){
  .panes{grid-template-columns:260px minmax(0,1fr)}
  .context{display:none}
}
@media (max-width:760px){
  .top{gap:12px;padding:0 16px}
  .nav,.search{display:none}
  .me{margin-left:auto}
  .run{flex-wrap:wrap;padding:16px 16px 12px;gap:12px}
  .run h1{font-size:28px;width:100%}
  .panes{grid-template-columns:1fr;height:auto;padding:0 16px 16px}
  .queue{display:flex;overflow-x:auto;gap:6px;padding:8px;scroll-snap-type:x mandatory}
  .group{display:none}
  .item{min-width:200px;scroll-snap-align:start;border:1px solid var(--line)}
  .head{padding:18px 18px 14px}.head h2{font-size:32px}
  .compose{padding:14px 18px}.actions{padding:12px 18px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">Ospra<b>.</b></div>
  <nav class="nav" aria-label="Main">
    <a href="#" aria-current="page">Today</a><a href="#">Accounts</a><a href="#">Sequences</a><a href="#">Reports</a>
  </nav>
  <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="Find an account or contact" aria-label="Search"></label>
  <div class="me" aria-label="Signed in as Aditi V.">AV</div>
</header>

<section class="run" aria-label="Today's progress">
  <h1 id="headline">Today's touches</h1>
  <div class="tape" id="tape" role="img" aria-label="Progress"></div>
  <div class="count" id="count"></div>
</section>

<main class="panes">
  <nav class="pane queue" id="queue" aria-label="Queue" role="listbox"></nav>
  <section class="pane work" id="work" aria-live="polite"></section>
  <aside class="pane ctx context" id="ctx"></aside>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const ACCOUNTS=[
 {id:'veltra',co:'Veltra Cells',city:'Pune',seg:'Two-wheeler packs',vol:'18k packs a month',person:'Ritika Menon',first:'Ritika',role:'Head of Quality',stage:'t2',step:2,ch:'email',due:'overdue',signal:'Opened your first email three times since Friday',fit:92,owner:'AV',warm:true},
 {id:'halden',co:'Halden Energy',city:'Hyderabad',seg:'Cell assembly',vol:'11k cells a day',person:'Ananya Rao',first:'Ananya',role:'QA Manager',stage:'replied',step:2,ch:'reply',due:'overdue',signal:'Replied asking how Battery Aadhaar reporting works',fit:86,owner:'AV',warm:true},
 {id:'kaveri',co:'Kaveri Energy Systems',city:'Hosur',seg:'Three-wheeler and ESS packs',vol:'9k packs a month',person:'Arjun Iyer',first:'Arjun',role:'VP Operations',stage:'replied',step:3,ch:'reply',due:'today',signal:'Replied: "Send the warranty case study"',fit:88,owner:'AV',warm:true},
 {id:'sunline',co:'Sunline Batteries',city:'Ahmedabad',seg:'Lead-acid moving to Li-ion',vol:'40k units a month',person:'Neha Shah',first:'Neha',role:'CTO',stage:'t1',step:1,ch:'linkedin',due:'today',signal:'Posted a role for a traceability lead on Monday',fit:81,owner:'AV'},
 {id:'arkos',co:'Arkos Power',city:'Chennai',seg:'Cell assembly',vol:'25k cells a day',person:'Divya Raman',first:'Divya',role:'Plant Head',stage:'t3',step:3,ch:'call',due:'today',signal:'Visited the pricing page twice this week',fit:77,owner:'AV',warm:true},
 {id:'meridian',co:'Meridian Mobility',city:'Bengaluru',seg:'Three-wheeler fleet packs',vol:'6k packs a month',person:'Farah Siddiqui',first:'Farah',role:'COO',stage:'t1',step:1,ch:'email',due:'today',signal:'Announced a Series B to double pack output',fit:73,owner:'AV'},
 {id:'saarthi',co:'Saarthi EV Packs',city:'Indore',seg:'E-rickshaw packs',vol:'5k packs a month',person:'Rohan Jain',first:'Rohan',role:'Owner',stage:'t3',step:3,ch:'linkedin',due:'today',signal:'Accepted your connection request',fit:69,owner:'AV'},
 {id:'trident',co:'Trident Cellworks',city:'Noida',seg:'Energy storage integrator',vol:'1.2 GWh a year',person:'Sameer Kulkarni',first:'Sameer',role:'Head of Warranty',stage:'t2',step:2,ch:'email',due:'tomorrow',signal:'Recalled a module batch in October',fit:84,owner:'AV'},
 {id:'northgrid',co:'Northgrid EV',city:'Gurugram',seg:'In-house two-wheeler packs',vol:'12k packs a month',person:'Kabir Malhotra',first:'Kabir',role:'Director, Manufacturing',stage:'meeting',step:5,ch:'prep',due:'tomorrow',signal:'Demo booked for Thursday at 11:00',fit:95,owner:'AV',warm:true},
 {id:'ojas',co:'Ojas Batteries',city:'Coimbatore',seg:'Replacement two-wheeler packs',vol:'7k packs a month',person:'Vikram Nair',first:'Vikram',role:'Founder',stage:'t2',step:2,ch:'email',due:'tomorrow',signal:'Said budget opens in Q2',fit:64,owner:'AV'},
];
const CH={
 email:{label:'Email',icon:'<path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/>'},
 reply:{label:'Reply',icon:'<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 5 5v4"/>'},
 linkedin:{label:'LinkedIn note',icon:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 11v5M8 8v.01M12 16v-5M16 16v-3a2 2 0 0 0-4 0"/>'},
 call:{label:'Call',icon:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>'},
 prep:{label:'Meeting prep',icon:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'},
};
const ic=(k,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${CH[k].icon}</svg>`;

function draft(a){
 const f=a.first;
 switch(a.ch){
  case 'reply':return{subject:`Re: Traceability at ${a.co}`,body:`Hi ${f},\n\n${a.id==='kaveri'?'Attached is the warranty case study. The short version: a pack maker of your size cut disputed claims by separating misuse from genuine cell defects, using build and field history on one record.':'Battery Aadhaar reporting pulls from the same battery identity we capture on the line, so you report once instead of rebuilding the data for each portal.'}\n\nWould 30 minutes next week work to walk through it with your line data?\n\nAditi`};
  case 'linkedin':return{subject:'Connection note',body:`Hi ${f}, ${a.signal.toLowerCase().startsWith('accepted')?'thanks for connecting.':'saw you are hiring for traceability.'} We help pack makers like ${a.co} give every battery one record from the line to the field. Worth a short call?`};
  case 'call':return{subject:'Call plan',body:`Open: ${a.signal.toLowerCase()}, so pricing is likely on ${f}'s mind.\n\nAsk: how do you link end-of-line test results to warranty claims today?\n\nIf they have a gap: offer a FloorSight pilot on one line.\n\nIf no answer: leave a 20 second voicemail and send touch 4 by email.`};
  case 'prep':return{subject:`Demo with ${a.co}`,body:`Attendees: ${a.person} (${a.role}) and two line supervisors.\n\nShow TraceSight first: their pain is linking cell lots to field returns.\n\nBring the 12k packs a month sizing and the pilot scope.`};
  default:return{subject:a.step===1?`One record per battery at ${a.co}`:`Following up on traceability`,body:`Hi ${f},\n\n${a.step===1?`${a.signal}. Usually that means cell lots, line data and field returns live in different systems.`:`Following up on my note last week. ${a.signal}.`}\n\nOspra gives every battery one digital identity, from the cell lot and station on your line to state of health in the field. Teams use it to settle warranty disputes on evidence and report once for the EU Battery Passport and Battery Aadhaar.\n\nOpen to 20 minutes next week?\n\nAditi`};
 }
}

const order={overdue:0,today:1,tomorrow:2};
const groupName={overdue:'Overdue',today:'Due today',tomorrow:'Tomorrow'};
let items=ACCOUNTS.map(a=>({...a,state:'open'}));
let current=items[0].id;
const total=items.filter(a=>a.due!=='tomorrow').length;
const $=s=>document.querySelector(s);
const open=()=>items.filter(a=>a.state==='open').sort((x,y)=>order[x.due]-order[y.due]);

function renderTape(){
 const cells=items.filter(a=>(a.origDue||a.due)!=='tomorrow');
 $('#tape').innerHTML=cells.map(a=>`<span class="cell ${a.state==='done'?'done':a.state==='snoozed'?'snoozed':a.id===current?'now':''}" title="${a.co}"></span>`).join('');
 const done=cells.filter(a=>a.state==='done').length;
 $('#count').innerHTML=`<strong>${done}</strong> of ${cells.length} sent`;
 $('#tape').setAttribute('aria-label',`${done} of ${cells.length} touches sent today`);
 const left=cells.length-done-cells.filter(a=>a.state==='snoozed').length;
 $('#headline').textContent=left?`${left} touches left today`:'Today is done';
}
function renderQueue(){
 const list=open();let html='',g='';
 list.forEach(a=>{
  if(a.due!==g){g=a.due;html+=`<div class="group"><span>${groupName[g]}</span><span>${list.filter(x=>x.due===g).length}</span></div>`}
  html+=`<button class="item" role="option" data-id="${a.id}" aria-selected="${a.id===current}"><span class="ch">${ic(a.ch,15)}</span><span><div class="co">${a.co}</div><div class="who">${a.person}</div></span>${a.warm?'<span class="warm" title="Warm signal"></span>':'<span></span>'}</button>`;
 });
 $('#queue').innerHTML=html||`<div class="empty"><p>Queue clear</p><p>Tomorrow's touches show up here at 8:00.</p></div>`;
}
function renderWork(){
 const a=items.find(x=>x.id===current&&x.state==='open');
 if(!a){$('#work').innerHTML=`<div class="empty" style="margin:auto"><p>Nothing left to send</p><p>Pick an account from Accounts to start a new sequence.</p></div>`;$('#ctx').innerHTML='';return}
 const d=draft(a);const isEmail=['email','reply'].includes(a.ch);
 $('#work').innerHTML=`
 <div class="head">
  <div class="line1"><h2>${a.co}</h2><span class="step">${a.stage==='meeting'?'Meeting booked':a.stage==='replied'?'Replied':'Touch '+(a.step+1)+' of 5'}</span></div>
  <div class="who">${a.person}, ${a.role}</div>
  <div class="why"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><div><b>Why now.</b> ${a.signal}.</div></div>
 </div>
 <div class="compose">
  <div class="field"><label for="subj">${isEmail?'Subject':CH[a.ch].label}</label><input id="subj" value="${d.subject.replace(/"/g,'&quot;')}"></div>
  <textarea id="body" aria-label="Message">${d.body}</textarea>
 </div>
 <div class="actions">
  <button class="btn primary" data-act="send">${ic(a.ch==='call'?'call':a.ch==='prep'?'prep':'email',15)}${a.ch==='call'?'Log call':a.ch==='prep'?'Mark prepared':a.ch==='linkedin'?'Send note':'Send'} <kbd>E</kbd></button>
  <button class="btn" data-act="snooze">Move to tomorrow <kbd>S</kbd></button>
  <span class="spacer"></span><span class="hint">J and K move through the queue</span>
 </div>`;
 const steps=[['Intro email','Nov 18'],['Follow-up email','Nov 21'],['Call','Nov 25'],['LinkedIn note','Nov 28'],['Breakup email','Dec 2']];
 $('#ctx').innerHTML=`
  <h3>Account</h3>
  <dl class="facts"><dt>Location</dt><dd>${a.city}</dd><dt>Makes</dt><dd>${a.seg}</dd><dt>Volume</dt><dd>${a.vol}</dd><dt>Fit</dt><dd>${a.fit} / 100</dd></dl>
  <h3>Sequence</h3>
  <ol class="seq">${steps.map((s,i)=>`<li class="${i<a.step?'sent':i===a.step?'cur':''}"><span class="dot"></span><span>${i===a.step&&CH[a.ch]?CH[a.ch].label:s[0]}</span><time>${s[1]}</time></li>`).join('')}</ol>
  <h3>Last note</h3>
  <p class="note">Met ${a.first}'s team at the India Battery Show. Interested in tying cell lot data to field returns.</p>`;
}
function render(){renderTape();renderQueue();renderWork()}
function toast(msg,undo){const t=$('#toast');t.innerHTML=msg+(undo?'<button>Undo</button>':'');t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3500);if(undo)t.querySelector('button').onclick=()=>{undo();t.classList.remove('show')}}
function act(kind){
 const a=items.find(x=>x.id===current&&x.state==='open');if(!a)return;
 const list=open();const i=list.indexOf(a);const next=list[i+1]||list[i-1];
 const el=document.querySelector(`.item[data-id="${a.id}"]`);
 const finish=()=>{
  if(kind==='send'){a.state='done';toast(`${a.ch==='call'?'Logged call with':a.ch==='prep'?'Prepared for':'Sent to'} ${a.person}`,()=>{a.state='open';current=a.id;render()})}
  else{a.origDue=a.origDue||a.due;a.state='snoozed';toast(`Moved ${a.co} to tomorrow`,()=>{a.state='open';current=a.id;render()})}
  current=next?next.id:null;render();
 };
 if(el&&!matchMedia('(prefers-reduced-motion:reduce)').matches){el.classList.add('leaving');setTimeout(finish,300)}else finish();
}
items.forEach(a=>a.origDue=a.due);
document.addEventListener('click',e=>{
 const it=e.target.closest('.item');if(it){current=it.dataset.id;render();return}
 const b=e.target.closest('[data-act]');if(b)act(b.dataset.act);
});
document.addEventListener('keydown',e=>{
 const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
 if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();act('send');return}
 if(typing)return;
 const list=open();const i=list.findIndex(a=>a.id===current);
 if(e.key==='j'||e.key==='ArrowDown'){e.preventDefault();if(list[i+1]){current=list[i+1].id;render()}}
 if(e.key==='k'||e.key==='ArrowUp'){e.preventDefault();if(list[i-1]){current=list[i-1].id;render()}}
 if(e.key==='e')act('send');
 if(e.key==='s')act('snooze');
});
render();
</script>
</body>
</html>
